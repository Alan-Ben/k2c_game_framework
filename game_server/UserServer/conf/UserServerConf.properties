#平台提供的大区id，通用请求的一部分
UserServer.PlatAreaId = 1

#平台提供的平台id，通用请求的一部分
UserServer.PlatformId = 1

#开启用户服务器的数量
UserServer.openCount = 1

#用户服务器的列表，格式为1:2:3....
UserServer.typeId = 1

#最高可加载的用户数据数量，超出数量则需要排队
UserServer.maxLoadUserData = 3000

#最大注册玩家数，目前仅做预警处理，不做限制
UserServer.userMaxCount = 3000

#玩家数据卸载时间，最低为600000毫秒
UserServer.userDataExpiredTimeMs = 600000

#服务器是否需要依赖CS上的服务器信息开启，默认需要，如果特殊情况本地设置为false
UserServer.needRelyCSOpen = true

#服务器是否非正式服务器，一般在一些信息获取的流程上会根据本变量做一些特殊处理。默认false
UserServer.isIllegalServer = false

#时区信息
UserServer.TimeZone = GMT+8:00

#是否开启GM命令
UserServer.openGM = false

