
#登录服务器对应的地域标记
GateServer.AreaTag = common
#登录服务器在登录服务器类型中的类型Id，不同Login服务器的本Id必须不同
GateServer.TypeId = 1

#可以处理的总用户数量
GateServer.UserMaxCount = 2000
#单个用户的权重配值
GateServer.UserHandleWeight = 1
                
#客户端连接Ip
GateServer.ConnectIp = 127.0.0.1
#客户端连接端口
GateServer.ConnectPort = 5201
#客户端连接缓冲区大小
GateServer.ClientSocketCacheSize = 102400

#时区信息
GateServer.TimeZone = GMT+8:00

################以上为服务器配置#######################